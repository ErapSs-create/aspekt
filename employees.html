    <div class="sidebar-user">
      <div class="sidebar-user__avatar">АИ</div>
      <div>
        <div class="sidebar-user__name">Анна Иванова</div>
        <div class="sidebar-user__role">HR · Стройинвест</div>
      </div>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <div class="app-breadcrumbs"><a href="dashboard.html">Личный кабинет</a> / Сотрудники</div>
        <h1 class="app-title">Иностранные сотрудники</h1>
      </div>
      <div class="app-actions">
        <button class="btn btn-secondary" id="btn-reset">Сбросить демо-данные</button>
        <button class="btn btn-primary" id="btn-add">+ Добавить сотрудника</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel__head">
        <h3 class="panel__title">Список сотрудников</h3>
        <div class="panel__actions" style="gap:8px;">
          <select id="filter-status" class="form-field" style="padding:8px 12px;border:1px solid #C8DEDE;border-radius:6px;font-size:13px;">
            <option value="all">Все статусы</option>
            <option value="expired">Просроченные</option>
            <option value="critical">Критические (≤7 дней)</option>
            <option value="soon">Истекают (≤30 дней)</option>
            <option value="ok">Действуют</option>
          </select>
          <input id="search" type="text" placeholder="Поиск по ФИО/документу..." style="padding:8px 12px;border:1px solid #C8DEDE;border-radius:6px;font-size:13px;width:240px;" />
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>Сотрудник</th>
            <th>Гражданство</th>
            <th>Документ</th>
            <th>Срок действия</th>
            <th>Статус</th>
            <th>МВД</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="emp-list"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Модальное окно добавления / редактирования -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal__head">
      <h3 class="modal__title" id="modal-title">Добавить сотрудника</h3>
      <button class="modal__close" id="modal-close">×</button>
    </div>
    <div class="modal__body">
      <form id="emp-form">
        <input type="hidden" id="f-id" />
        <div class="form-grid">
          <div class="form-field" style="grid-column:1/-1;">
            <label>ФИО *</label>
            <input id="f-name" type="text" required placeholder="Иванов Иван Иванович" />
          </div>
          <div class="form-field">
            <label>Гражданство *</label>
            <select id="f-citizenship" required>
              <option>Узбекистан</option>
              <option>Таджикистан</option>
              <option>Кыргызстан</option>
              <option>Казахстан</option>
              <option>Армения</option>
              <option>Беларусь</option>
              <option>Азербайджан</option>
              <option>Молдова</option>
              <option>Украина</option>
              <option>Другое</option>
            </select>
          </div>
          <div class="form-field">
            <label>Должность</label>
            <input id="f-position" type="text" placeholder="Монтажник" />
          </div>
          <div class="form-field">
            <label>Подразделение</label>
            <input id="f-department" type="text" placeholder="Стройка №1" />
          </div>
          <div class="form-field">
            <label>Тип документа *</label>
            <select id="f-doctype" required>
              <option>Патент на работу</option>
              <option>Разрешение на работу</option>
              <option>РВП</option>
              <option>ВНЖ</option>
              <option>Свидетельство о временном убежище</option>
            </select>
          </div>
          <div class="form-field">
            <label>Номер документа</label>
            <input id="f-docnumber" type="text" placeholder="77 22 1234567" />
          </div>
          <div class="form-field">
            <label>Дата выдачи</label>
            <input id="f-issue" type="date" />
          </div>
          <div class="form-field">
            <label>Дата окончания *</label>
            <input id="f-expiry" type="date" required />
          </div>
          <div class="form-field">
            <label>Дата медосмотра</label>
            <input id="f-medical" type="date" />
          </div>
          <div class="form-field">
            <label>Уведомление в МВД</label>
            <select id="f-mvd">
              <option value="true">Подано</option>
              <option value="false">Не подано</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="modal__foot">
      <button class="btn btn-ghost" id="modal-cancel">Отмена</button>
      <button class="btn btn-danger hidden" id="btn-delete">Удалить</button>
      <button class="btn btn-primary" id="btn-save">Сохранить</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
(function() {
  let employees = Aspect.loadEmployees();
  const tbody = document.getElementById("emp-list");
  const modal = document.getElementById("modal");

  function render() {
    const filter = document.getElementById("filter-status").value;
    const q = document.getElementById("search").value.trim().toLowerCase();
    let list = employees.slice();
    if (filter !== "all") {
      list = list.filter(e => Aspect.docStatus(e).code === filter);
    }
    if (q) {
      list = list.filter(e =>
        e.fullName.toLowerCase().includes(q) ||
        (e.docNumber || "").toLowerCase().includes(q) ||
        (e.position || "").toLowerCase().includes(q)
      );
    }
    list.sort((a, b) => Aspect.docStatus(a).days - Aspect.docStatus(b).days);
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--neutral);">Нет сотрудников по выбранному фильтру</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(e => `
      <tr>
        <td>
          <div class="emp-cell">
            <div class="emp-avatar">${Aspect.initials(e.fullName)}</div>
            <div>
              <div class="emp-cell__name">${e.fullName}</div>
              <div class="emp-cell__sub">${e.position || "—"} · ${e.department || "—"}</div>
            </div>
          </div>
        </td>
        <td>${e.citizenship}</td>
        <td>${e.docType}<div class="small muted">${e.docNumber || ""}</div></td>
        <td>${Aspect.fmtDate(e.expiryDate)}</td>
        <td>${Aspect.statusBadge(e)}</td>
        <td>${e.mvdNotified
            ? '<span class="badge badge-green">Подано</span>'
            : '<span class="badge badge-red">Не подано</span>'}</td>
        <td>
          <a class="btn btn-light btn-sm" href="employee.html?id=${e.id}">Открыть</a>
          <button class="btn btn-ghost btn-sm" onclick="window.editEmp(${e.id})">Изменить</button>
        </td>
      </tr>
    `).join("");
  }

  // ===== Модалка =====
  function openModal(emp) {
    document.getElementById("f-id").value = emp ? emp.id : "";
    document.getElementById("modal-title").textContent = emp ? "Редактировать сотрудника" : "Добавить сотрудника";
    document.getElementById("f-name").value = emp ? emp.fullName : "";
    document.getElementById("f-citizenship").value = emp ? emp.citizenship : "Узбекистан";
    document.getElementById("f-position").value = emp ? emp.position || "" : "";
    document.getElementById("f-department").value = emp ? emp.department || "" : "";
    document.getElementById("f-doctype").value = emp ? emp.docType : "Патент на работу";
    document.getElementById("f-docnumber").value = emp ? emp.docNumber || "" : "";
    document.getElementById("f-issue").value = emp ? emp.issueDate || "" : "";
    document.getElementById("f-expiry").value = emp ? emp.expiryDate || "" : "";
    document.getElementById("f-medical").value = emp ? emp.medicalCheckDate || "" : "";
    document.getElementById("f-mvd").value = emp && !emp.mvdNotified ? "false" : "true";
    document.getElementById("btn-delete").classList.toggle("hidden", !emp);
    modal.classList.add("is-open");
  }
  function closeModal() { modal.classList.remove("is-open"); }

  document.getElementById("btn-add").addEventListener("click", () => openModal(null));
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  document.getElementById("btn-save").addEventListener("click", () => {
    const id = document.getElementById("f-id").value;
    const data = {
      fullName: document.getElementById("f-name").value.trim(),
      citizenship: document.getElementById("f-citizenship").value,
      position: document.getElementById("f-position").value.trim(),
      department: document.getElementById("f-department").value.trim(),
      docType: document.getElementById("f-doctype").value,
      docNumber: document.getElementById("f-docnumber").value.trim(),
      issueDate: document.getElementById("f-issue").value,
      expiryDate: document.getElementById("f-expiry").value,
      medicalCheckDate: document.getElementById("f-medical").value,
      mvdNotified: document.getElementById("f-mvd").value === "true",
    };
    if (!data.fullName || !data.expiryDate) {
      alert("Заполните ФИО и дату окончания документа");
      return;
    }
    if (id) {
      const idx = employees.findIndex(e => e.id === parseInt(id));
      if (idx >= 0) employees[idx] = Object.assign({}, employees[idx], data);
    } else {
      const newId = Math.max(0, ...employees.map(e => e.id)) + 1;
      employees.push(Object.assign({ id: newId }, data));
    }
    Aspect.saveEmployees(employees);
    closeModal();
    render();
  });

  document.getElementById("btn-delete").addEventListener("click", () => {
    const id = parseInt(document.getElementById("f-id").value);
    if (!id) return;
    if (!confirm("Удалить сотрудника? Действие нельзя отменить.")) return;
    employees = employees.filter(e => e.id !== id);
    Aspect.saveEmployees(employees);
    closeModal();
    render();
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    if (confirm("Сбросить демо-данные к заводским?")) {
      Aspect.resetEmployees();
      employees = Aspect.loadEmployees();
      render();
    }
  });

  document.getElementById("filter-status").addEventListener("change", render);
  document.getElementById("search").addEventListener("input", render);

  window.editEmp = (id) => {
    const emp = employees.find(e => e.id === id);
    if (emp) openModal(emp);
  };

  // Если URL ?add=1 — открыть модалку
  if (new URLSearchParams(location.search).get("add") === "1") openModal(null);
  // Если URL ?filter=...
  const f = new URLSearchParams(location.search).get("filter");
  if (f) document.getElementById("filter-status").value = f;

  render();
})();
</script>

</body>
